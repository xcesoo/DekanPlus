services:
  db:
    image: postgres:16-alpine
    container_name: dekan_plus_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: dekan_plus_dev
    ports:
      - "5432:5432"
    volumes:
      - dekan_plus_pgdata:/var/lib/postgresql/data

volumes:
  dekan_plus_pgdata:
